appId: com.feedflow.app
productName: FeedFlow
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - plugins/**/*
# 自动更新元数据：构建时生成 latest-mac.yml / latest.yml / latest-linux.yml，
# 供应用内 electron-updater 检测新版本。CI 中使用 --publish never 只生成不上传，
# 由 release job 统一上传到 GitHub Release。
publish:
  provider: github
  owner: joyme123
  repo: feedflow
mac:
  category: public.app-category.news
  target:
    - dmg
    - zip
  # ---- 代码签名 ----
  # Developer ID Application 证书名称，CI 中通过 CSC_LINK / CSC_KEY_PASSWORD 注入证书，
  # 本地构建时若钥匙串中有匹配证书也会自动使用。
  identity: null
  # 公证的前提：启用 Hardened Runtime
  hardenedRuntime: true
  # 权限声明：Electron/V8/better-sqlite3 所需的最低权限
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # ---- 公证（Notarization）----
  # 使用 App Store Connect API Key 进行公证（推荐，比 Apple ID + 专用密码更稳定）。
  # 凭据通过环境变量注入：APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH
  notarize:
    teamId: ${APPLE_TEAM_ID}
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
