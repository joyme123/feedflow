<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #1f2937;
      background: #f9fafb;
    }
    .header {
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 13px; font-weight: 600; }
    .conn { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #6b7280; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .dot.online { background: #22c55e; }

    .toolbar {
      padding: 6px 12px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .toolbar input { cursor: pointer; }

    .list { padding: 6px; }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      margin-bottom: 5px;
    }
    .row .name {
      font-weight: 600;
      font-size: 12px;
      min-width: 42px;
      flex-shrink: 0;
    }
    .badges {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      min-width: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.err { background: #fee2e2; color: #991b1b; }
    .badge.muted { background: #f3f4f6; color: #6b7280; }
    .badge.info { background: #dbeafe; color: #1e40af; }

    .btn {
      flex-shrink: 0;
      padding: 3px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      color: #374151;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #f9fafb; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .btn.primary:hover:not(:disabled) { background: #1d4ed8; }

    .empty { padding: 20px 12px; text-align: center; color: #9ca3af; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FeedFlow</h1>
    <div class="conn">
      <span class="dot" id="connDot"></span>
      <span id="connText">连接中…</span>
    </div>
  </div>

  <div class="toolbar">
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
      <input type="checkbox" id="autoSyncToggle" checked />
      <span>自动同步</span>
    </label>
  </div>

  <div class="list" id="providerList">
    <div class="empty">加载中…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
