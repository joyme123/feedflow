name: Release

# 触发条件：
#   1. 推送符合 semver 的 tag（如 v0.1.0）
#   2. 手动触发（workflow_dispatch），便于补跑 / 调试
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # 预发布 tag，如 v0.2.0-beta.1
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（留空则使用当前触发的 ref）'
        required: false

# 创建 Release 需要写仓库内容的权限
permissions:
  contents: write

env:
  # 供 electron-builder 自动上传产物到 Release（本工作流未启用 publish，
  # 但保留以便后续开启 auto-publish 时直接生效）
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ----------------------------------------------------------------------
  # 校验：tag 必须与 package.json 中的 version 一致，避免错版
  # ----------------------------------------------------------------------
  version-check:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions
        id: ver
        run: |
          # 手动触发（workflow_dispatch）时使用 inputs.tag，推送 tag 时使用 GITHUB_REF_NAME
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG_VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG"
          echo "pkg=$PKG_VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG_VER" >> "$GITHUB_OUTPUT"

      - name: Fail on mismatch
        if: steps.ver.outputs.tag != steps.ver.outputs.pkg
        run: |
          echo "::error::Tag (${{ steps.ver.outputs.tag }}) 与 package.json version (${{ steps.ver.outputs.pkg }}) 不一致"
          echo "请先更新 package.json 的 version，再打 tag 推送。"
          exit 1

  # ----------------------------------------------------------------------
  # 扩展打包：将 extensions/cookie-sync 打包为 Chrome Web Store 可上传的 ZIP
  # 扩展有独立的版本号（manifest.json），与桌面端版本解耦，因此不做版本一致性校验。
  # ----------------------------------------------------------------------
  package-extension:
    name: Package Chrome extension
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Package extension
        run: npm run package:extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: feedflow-cookie-sync-extension
          path: feedflow-cookie-sync-*.zip
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------------
  # 构建：每个平台在原生 runner 上构建，确保 better-sqlite3 等原生模块正确
  # ----------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：同时出 arm64（Apple Silicon）与 x64（Intel）
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          # Windows
          - os: windows-latest
            platform: win
            arch: x64
          # Linux
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux 构建 AppImage / deb 所需的系统依赖
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libfuse2

      - name: Install dependencies
        run: npm ci
        env:
          # 让 better-sqlite3 等原生模块按目标 arch 拉取/编译预构建产物
          npm_config_arch: ${{ matrix.arch }}

      # ---- macOS：准备代码签名证书与公证凭据 ----
      # 仅当仓库配置了对应 Secrets 时生效；未配置时 electron-builder 会自动跳过签名/公证。
      - name: Prepare macOS signing & notarization credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          # 1) 解码 Developer ID 证书（.p12）到临时文件
          if [ -n "$CSC_LINK_BASE64" ]; then
            echo "$CSC_LINK_BASE64" | base64 --decode > /tmp/cert.p12
            echo "CSC_LINK=/tmp/cert.p12" >> "$GITHUB_ENV"
          fi
          # 2) 写入 App Store Connect API Key（.p8）到临时文件
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > /tmp/AuthKey.p8
            # APPLE_API_KEY 需为 .p8 文件路径（notarytool --key 参数）
            echo "APPLE_API_KEY=/tmp/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=/tmp/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build & package
        # --publish never：只生成 latest*.yml 自动更新元数据，不上传（由 release job 统一发布）
        run: npm run package:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
        env:
          npm_config_arch: ${{ matrix.arch }}
          # ---- macOS 代码签名 ----
          # CSC_LINK / CSC_KEY_PASSWORD 由上一步写入 GITHUB_ENV；未配置 Secrets 时自动跳过签名
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # ---- macOS 公证（Notarization）----
          # 使用 App Store Connect API Key 方式（推荐）
          # APPLE_API_KEY（.p8 文件路径）由上一步写入 GITHUB_ENV
          # APPLE_API_KEY_ID 为 Key ID，APPLE_API_ISSUER 为 Issuer ID
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feedflow-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------------
  # 发布：汇总所有产物，创建 GitHub Release
  # ----------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build, package-extension]
    runs-on: ubuntu-latest
    steps:
      # 需要检出代码以读取 CHANGELOG.md 并调用 scripts/extract-changelog-section.sh
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # 从 CHANGELOG.md 中提取本次版本对应的小节，作为 Release 正文。
      # 若该版本小节不存在，脚本会以非零状态退出，从而阻断发布——
      # 这强制要求发版前先在 CHANGELOG.md 中补充该版本的变更记录。
      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ./scripts/extract-changelog-section.sh "$VERSION" CHANGELOG.md > release_body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "--- release body preview ---"
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FeedFlow ${{ inputs.tag || github.ref_name }}
          # Release 正文来自 CHANGELOG.md 中对应版本的小节
          body_path: release_body.md
          # 预发布 tag（带 -alpha/-beta/-rc 等）标记为 prerelease
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/latest*.yml

  # ----------------------------------------------------------------------
  # 发布到 Chrome Web Store：上传扩展 ZIP 并提交审核
  # 受保护环境 chrome-web-store：在仓库设置中为该环境配置人工审批门，避免误发布。
  # 未配置发布凭据时跳过，不阻塞 GitHub Release。
  # ----------------------------------------------------------------------
  publish-extension:
    name: Publish extension to Chrome Web Store
    needs: package-extension
    runs-on: ubuntu-latest
    environment: chrome-web-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史以比较上一个 release tag 以来 extensions/ 目录的变更
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: feedflow-cookie-sync-extension

      - name: Resolve package path
        id: pkg
        run: echo "zip=$(ls feedflow-cookie-sync-*.zip)" >> "$GITHUB_OUTPUT"

      # 环境级变量只有进入环境后才可见，所以降级判断放在步骤级而非 job 级 if。
      - name: Check publish credentials
        id: creds
        run: |
          if [ -n "${{ vars.CWS_PUBLISHER_ID }}" ] && [ -n "${{ vars.CWS_EXTENSION_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store 发布凭据未配置，跳过发布。"
          fi

      # 仅当 extensions/ 目录自上一个 release tag 以来有变更时才发布到商店，
      # 避免桌面端发版时重复提交未改动的扩展进入审核队列。
      - name: Check if extension changed since last release
        id: ext-changed
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::未找到上一个 release tag，按首次发布处理。"
            exit 0
          fi
          if git diff --quiet "$PREV_TAG" HEAD -- extensions/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::扩展自 $PREV_TAG 以来无变化，跳过 Chrome Web Store 发布。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::扩展自 $PREV_TAG 以来有变更，将发布到 Chrome Web Store。"
          fi

      - name: Upload and publish
        if: steps.creds.outputs.configured == 'true' && steps.ext-changed.outputs.changed == 'true'
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ZIP_PATH: ${{ steps.pkg.outputs.zip }}
          CWS_PUBLISH_TARGET: ${{ vars.CWS_PUBLISH_TARGET || 'DEFAULT_PUBLISH' }}
        run: npm run publish:extension

