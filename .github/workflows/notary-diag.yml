name: Notary Diagnostics (temporary)
on:
  workflow_dispatch:
jobs:
  notary-history:
    runs-on: macos-15
    steps:
      - name: Check notarytool authentication (read-only)
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > /tmp/AuthKey.p8
          echo "--- notarytool history（只读鉴权探测） ---"
          xcrun notarytool history \
            --key /tmp/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" 2>&1 | head -30
